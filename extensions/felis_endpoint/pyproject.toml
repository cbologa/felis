[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "felis-endpoint-workflows"
version = "0.1.0"
description = "Derived physical endpoint MD and qualification for portable FELIS runs"
requires-python = ">=3.11"
dependencies = ["felis-workflows==0.2.0", "PyYAML>=6,<7"]

[project.optional-dependencies]
simulation = ["openmm>=8", "mdtraj>=1.10"]

[project.scripts]
felis-endpoint = "felis_endpoint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
