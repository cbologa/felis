[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "felis-workflows"
version = "0.1.0"
description = "Portable, additive workflows for pinned FELIS ABFE calculations"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]
license = {text = "Apache-2.0"}

[project.scripts]
felis-workflow = "felis_workflows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
felis_workflows = ["data/*"]
