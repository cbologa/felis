# Set the GPU/CPU partitions available to your Hopper allocation before use.
schema_version: 1
name: hopper
backend: slurm
repo: ${FELIS_REPO}
bootstrap: null
python:
  simulation: [conda, run, --no-capture-output, -n, felis, python]
  receptor: [conda, run, --no-capture-output, -n, felisff, python]
  gaff2: [conda, run, --no-capture-output, -n, felisff, python]
  sage: [conda, run, --no-capture-output, -n, felis_sage_params, python]
mpi: {command: mpirun, ranks: 4, extra_args: [--oversubscribe]}
mps: true
resources:
  prep: {cpus: 8, memory: 64G, walltime: '04:00:00'}
  array: {cpus: 8, memory: 64G, walltime: '12:00:00'}
  analysis: {cpus: 4, memory: 64G, walltime: '04:00:00'}
slurm:
  account: null
  partition: CHANGE_ME_GPU_PARTITION
  analysis_partition: CHANGE_ME_CPU_PARTITION
  gpu_args: [--gres=gpu:1]
  array_concurrency: 4
  prep_concurrency: 1
  extra_args: [--requeue]
