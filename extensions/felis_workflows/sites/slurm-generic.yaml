schema_version: 1
name: slurm-generic
backend: slurm
repo: ${FELIS_REPO}
bootstrap: null
python:
  simulation: [python]
  receptor: [python]
  gaff2: [python]
  sage: [python]
mpi: {command: mpirun, ranks: 4, extra_args: [--oversubscribe]}
mps: true
resources:
  prep: {cpus: 8, memory: 64G, walltime: '04:00:00'}
  array: {cpus: 8, memory: 64G, walltime: '24:00:00'}
  analysis: {cpus: 4, memory: 64G, walltime: '04:00:00'}
slurm:
  account: null
  partition: CHANGE_ME_GPU_PARTITION
  analysis_partition: CHANGE_ME_CPU_PARTITION
  gpu_args: [--gpus=1]
  array_concurrency: 4
  prep_concurrency: 1
  extra_args: []
